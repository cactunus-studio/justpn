[package]
name = "justpn"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "software-renderer-systemfonts", "compat-1-2"] }
ureq = { version = "3.5.2", default-features = false, features = ["rustls", "gzip"] }
windows-sys = { version = "0.61.2", features = ["Win32_Networking_WinInet", "Win32_Foundation"] }
winreg = "0.56.0"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
