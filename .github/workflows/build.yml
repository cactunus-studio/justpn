name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/justpn.exe dist/JustPN.exe
          Get-Item dist/JustPN.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}
      - uses: actions/upload-artifact@v4
        with:
          name: JustPN-windows-x64
          path: dist/JustPN.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/JustPN.exe
